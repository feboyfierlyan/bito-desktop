<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bito · Clear glass preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#283b32;font:14px system-ui,sans-serif}main{max-width:820px;margin:48px auto;padding:0 24px}h1{font-size:28px;letter-spacing:-1px;font-weight:550;margin-bottom:8px}p{color:#657168;line-height:1.6;margin:0}nav{display:flex;gap:8px;margin:24px 0 12px}button{padding:9px 16px;border:1px solid #d0d9d0;border-radius:30px;color:inherit;background:white;cursor:pointer}button[aria-pressed=true]{background:#283b32;color:white}.stage{height:400px;border-radius:28px;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 70%,#253e34,transparent 60%),linear-gradient(120deg,#17201e,#394844);transition:background .2s}.stage[data-tone=light]{background:linear-gradient(120deg,#e8eee6,#b8d9c3)}.stage[data-tone=pattern]{background:repeating-linear-gradient(110deg,#dae9e1 0px,#dae9e1 22px,#669b87 23px,#669b87 26px,#c5dad0 27px,#c5dad0 52px)}iframe{border:0;width:240px;height:240px;transform:scale(1.25);background:transparent}small{display:block;margin-top:16px;line-height:1.7;color:#657168}
</style>
</head>
<body><main><h1>Bito · pill review</h1><p>Arahkan kursor ke Bito. Satu pill kaca dengan ikon kontras dan hover lembut.</p><nav aria-label="Latar preview"><button data-tone="dark" aria-pressed="true">Gelap</button><button data-tone="light" aria-pressed="false">Terang</button><button data-tone="pattern" aria-pressed="false">Berpola</button></nav><label style="display:block;margin:12px 0"><input id="hold" type="checkbox" checked> Tahan pill terbuka untuk review</label><div class="stage" data-tone="dark"><iframe title="Bito dan pill interaktif" src="/?surface=pet"></iframe></div><small>Efek visual ala Liquid Glass · CSS saja, tanpa screen capture, native glass, atau renderer animasi tambahan. Transisi 280–300 ms dengan toleransi keluar 65 ms; tidak ada distorsi wallpaper.</small></main><script type="module">
const frame=document.querySelector('iframe');
function hold(){
  const doc=frame.contentDocument;if(!doc?.querySelector('.pet')){setTimeout(hold,100);return;}
  let style=doc.getElementById('preview-hold');if(!style){style=doc.createElement('style');style.id='preview-hold';doc.head.append(style);}
  style.textContent=document.querySelector('#hold').checked ? '.pet .pet-tools{width:116px}.pet .pet-idle-handle{width:116px;height:30px}.pet .pet-tool-actions{clip-path:inset(0 round 999px);opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}' : '';
}
frame.addEventListener('load',hold);document.querySelector('#hold').addEventListener('change',hold);hold();
for(const button of document.querySelectorAll('nav button')) button.addEventListener('click',()=>{document.querySelector('.stage').dataset.tone=button.dataset.tone;for(const option of document.querySelectorAll('nav button'))option.setAttribute('aria-pressed',String(option===button));});
</script></body></html>
