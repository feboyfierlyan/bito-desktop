name: Check and build desktop
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            command: package:mac
          - os: windows-latest
            platform: Windows
            command: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME!=='v'+p.version) process.exit(1)"
      - name: Read package version
        id: package
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version='+require('./package.json').version+'\n')"
      - run: npm test
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Bito-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/${{ steps.package.outputs.version }}/*.dmg
            release/${{ steps.package.outputs.version }}/*.zip
            release/${{ steps.package.outputs.version }}/*.exe
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: Bito-*-${{ github.sha }}
          merge-multiple: true
          path: release-assets
      - run: node scripts/release-manifest.mjs release-assets
      - name: Publish complete checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          title=$(sed -n '1s/^# //p' "$notes")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.dmg release-assets/*.zip release-assets/*.exe release-assets/*.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
